name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'New release'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter setup ───────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ── 3. Install dependencies (regenerates Generated.xcconfig) ───────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 4. Generate app icons ──────────────────────────────────────────────
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # ── 5. Verify FLUTTER_ROOT is correct macOS path ───────────────────────
      - name: Verify FLUTTER_ROOT
        run: |
          FLUTTER_ROOT=$(grep FLUTTER_ROOT ios/Flutter/Generated.xcconfig | cut -d= -f2)
          echo "FLUTTER_ROOT = $FLUTTER_ROOT"
          ls "$FLUTTER_ROOT/packages/flutter_tools/bin/podhelper.rb"

      # ── 6. Clean & install CocoaPods (avoids SPM/cache issues) ────────────
      - name: Install CocoaPods dependencies
        run: |
          pod install --repo-update
        working-directory: ios

      # ── 7. Build iOS RELEASE (required for sideloading — debug crashes) ───
      - name: Build iOS release (no signing)
        run: flutter build ios --release --no-codesign

      # ── 8. Package IPA (SideStore compatible) ─────────────────────────────
      - name: Package IPA
        run: |
          APP_PATH=$(find build/ios/iphoneos -name "*.app" | head -1)
          echo "Found app at: $APP_PATH"
          ls -la "$APP_PATH"

          # Clean temp build dir
          rm -rf /tmp/ipa_build
          mkdir -p /tmp/ipa_build/Payload

          # Copy .app into Payload/
          cp -r "$APP_PATH" /tmp/ipa_build/Payload/

          # Add iTunesArtwork (required by some sideloaders)
          ICON_PATH=$(find "$APP_PATH" -name "Icon-App-1024x1024@1x.png" | head -1)
          if [ -n "$ICON_PATH" ]; then
            cp "$ICON_PATH" /tmp/ipa_build/iTunesArtwork
            echo "Added iTunesArtwork"
          fi

          # Zip — paths must be Payload/Runner.app/... at root level
          cd /tmp/ipa_build
          zip -r FedProgressConnect.ipa Payload/ iTunesArtwork 2>/dev/null || zip -r FedProgressConnect.ipa Payload/
          mv FedProgressConnect.ipa $GITHUB_WORKSPACE/

          echo "=== IPA structure (first 20 entries) ==="
          unzip -l $GITHUB_WORKSPACE/FedProgressConnect.ipa | head -20

      # ── 9. Create GitHub Release & upload IPA ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Connect ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: FedProgressConnect.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
