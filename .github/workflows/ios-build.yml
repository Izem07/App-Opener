name: iOS Build & Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'New release'

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter setup ───────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install Flutter dependencies
        run: flutter pub get

      # ── 4. Generate app icons ──────────────────────────────────────────────
      - name: Generate app icons
        run: dart run flutter_launcher_icons

      # ── 5. Install CocoaPods ───────────────────────────────────────────────
      - name: Install CocoaPods dependencies
        run: pod install
        working-directory: ios

      # ── 6. Build iOS (unsigned) ────────────────────────────────────────────
      - name: Build iOS release (no signing)
        run: flutter build ios --release --no-codesign

      # ── 7. Package IPA ─────────────────────────────────────────────────────
      - name: Package IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r FedProgressConnect.ipa Payload/
          mv FedProgressConnect.ipa ../../..

      # ── 8. Create GitHub Release & upload IPA ─────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Connect ${{ github.event.inputs.version }}
          body: ${{ github.event.inputs.release_notes }}
          files: FedProgressConnect.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
