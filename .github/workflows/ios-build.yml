name: iOS Build

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allow manual trigger from GitHub UI

jobs:
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Flutter setup ───────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── 4. Generate app icons (requires assets/icon/app_icon.png) ──────────
      - name: Generate app icons
        run: dart run flutter_launcher_icons
        # If you haven't added the icon yet, comment out this step.
        # It will fail if assets/icon/app_icon.png is missing.

      # ── 5. Install CocoaPods dependencies ──────────────────────────────────
      - name: Install CocoaPods
        run: pod install
        working-directory: ios

      # ── 6. Build iOS (no code signing — produces unsigned .app) ───────────
      #       For a signed IPA ready for TestFlight, see the signing steps below.
      - name: Build iOS (no signing)
        run: |
          flutter build ios --release --no-codesign

      # ── 7. Package into IPA (ad-hoc unsigned, for local testing) ───────────
      - name: Package unsigned IPA
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../../../FedProgressConnect.ipa Payload/

      # ── 8. Upload IPA as artifact ──────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: FedProgressConnect-iOS
          path: FedProgressConnect.ipa
          retention-days: 30

